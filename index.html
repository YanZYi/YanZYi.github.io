<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yan Home | 博客</title>
    <link rel="shortcut icon" type="image/x-icon" href="image/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- marked: 将 Markdown 解析为 HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify: 对渲染后的 HTML 做 XSS 过滤 -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
    <!-- 粒子背景 -->
    <div id="particles-js"></div>

    <div class="layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="profile-card sidebar-profile">
                <div class="profile-main">
                    <img src="image/head.jpg" alt="Yan" class="profile-img">
                    <h2>严正易</h2>
                    <p class="subtitle">前端开发 · UI/UX · 创意技术</p>
                </div>
                <div class="profile-bio">
                    <p>热爱前端开发与用户体验，喜欢把复杂的设计转化为优雅的代码。在这里记录学习笔记与技术思考。</p>
                </div>
                <nav class="side-nav">
                    <a href="#/" class="side-link active" data-route="home"><i class="fas fa-home"></i> 首页</a>
                    <a href="#/archive" class="side-link" data-route="archive"><i class="fas fa-archive"></i> 文章归档</a>
                    <a href="#/about" class="side-link" data-route="about"><i class="fas fa-user"></i> 关于我</a>
                </nav>
                <div class="side-social">
                    <a href="#" title="GitHub"><i class="fab fa-github"></i></a>
                    <a href="#" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
                    <a href="#" title="Twitter"><i class="fab fa-twitter"></i></a>
                    <a href="#" title="Email"><i class="fas fa-envelope"></i></a>
                </div>
                <div class="side-meta">
                    <span><i class="fas fa-map-marker-alt"></i> 中国 · 无锡</span>
                    <span><i class="fas fa-envelope"></i> yanzymail@qq.com</span>
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="content" id="content">
            <!-- 视图由 JS 动态渲染 -->
        </main>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-logo">Yan Home</div>
            <div class="copyright">© 2026 Yan Home. Built with ❤️ on GitHub Pages.</div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
